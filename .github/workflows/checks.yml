name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install 'httpx[socks]>=0.28,<1'
      - run: python -m tests.check_lab
      - run: python -m tests.check_eval
      - run: python -m tests.check_expand
      - run: python -m tests.check_data
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build
